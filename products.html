<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Kurma Ajwa Products</title>

  <!-- Bootstrap CSS -->
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS files -->
  <link rel="stylesheet" href="assets/css/fontawesome.css">
  <link rel="stylesheet" href="assets/css/templatemo-sixteen.css">
  <link rel="stylesheet" href="assets/css/owl.css">

  <style>
    /* ── Add to cart button (matches product_details.html) ───────────── */
    .add-to-cart-btn {
      background: linear-gradient(135deg, #6b3a1f 0%, #a0522d 60%, #c8844a 100%);
      border: none;
      border-radius: 4px;
      color: #fdf6ed;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 13px 36px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 3px 12px rgba(107,58,31,0.3);
    }

    .add-to-cart-btn:hover {
      background: linear-gradient(135deg, #3b1f0a 0%, #6b3a1f 60%, #a0522d 100%);
      box-shadow: 0 5px 18px rgba(59,31,10,0.35);
      transform: translateY(-1px);
    }

    .add-to-cart-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
  </style>
</head>

<body>

  <!-- Preloader spinner shown while the page is loading -->
  <div id="preloader">
    <div class="jumper"><div></div><div></div><div></div></div>
  </div>

  <!-- Navigation bar -->
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/home"><h2>KURMA <em>AJWA</em></h2></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="/home">Home</a></li>
          <li class="nav-item active"><a class="nav-link" href="/products">Our Products</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>

          <!-- ── Cart link with badge ──────────────────────────────────────────
              The <span id="cartBadge"> is what cart.js's updateCartBadge()
              function looks for. It will:
                - set the number inside the span to the total qty in the cart
                - show/hide the span depending on whether the cart has items
              Clicking this link takes the user to /cart (cart.html below). -->
          <li class="nav-item">
            <a class="nav-link" href="/cart" style="position: relative;">
              <i class="fa fa-shopping-cart"></i> Cart
              <span id="cartBadge"
                    style="display:none; position:absolute; top:-5px; right:-10px;
                          background:#e74c3c; color:#fff; border-radius:50%;
                          padding:2px 6px; font-size:11px;">0</span>
            </a>
          </li>

          <li class="nav-item">
            <!-- Logout: clears localStorage and goes back to login page -->
            <a class="nav-link" href="#" onclick="logout()">Logout</a>
          </li>
        </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Page banner / hero section -->
  <div class="page-heading products-heading header-text">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="text-content">
            <h4>Browse</h4>
            <h2>Our Products</h2>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Products section -->
  <div class="products">
    <div class="container">
      <div class="row">

        <!-- Filter buttons – uses the Isotope JS library to sort/filter cards -->
        <div class="col-md-12">
          <div class="filters">
            <ul>
              <li class="active" data-filter="*">All Products</li>
              <li data-filter=".des">Featured</li>
              <li data-filter=".dev">Flash Deals</li>
              <li data-filter=".gra">Last Minute</li>
            </ul>
          </div>
        </div>

        <!-- Product cards container
             The 'grid' class is used by Isotope for the masonry/filter layout.
             The id="productGrid" lets our JavaScript inject cards here. -->
        <div class="col-md-12">
          <div class="filters-content">
            <div class="row grid" id="productGrid">

              <!-- Product cards will be injected here by loadProducts() below.
                   Each card will look exactly like the original HTML cards
                   but the name, price, and description come from the server. -->

              <!-- Loading placeholder shown while the API call is in progress -->
              <div class="col-12 text-center py-4" id="loadingMsg">
                <p>Loading products...</p>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>


  <!-- JavaScript libraries (must be in this order) -->
  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/custom.js"></script>
  <script src="assets/js/owl.js"></script>
  <script src="assets/js/slick.js"></script>
  <script src="assets/js/isotope.js"></script>
  <script src="assets/js/accordions.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/purchase.js"></script>


  <!-- ── Product loading + logout script ─────────────────────────────── -->
  <script>

    // ── Logout function ──────────────────────────────────────────────────
    // Called when the user clicks "Logout" in the nav bar.
    // Removes stored data and sends the user back to the login page.
    function logout() {
      localStorage.removeItem("role");       // remove the saved role
      localStorage.removeItem("customer");   // remove saved customer info
      window.location.href = "/";            // go back to index.html (login)
    }


    // ── loadProducts(): fetch products from server and render them ───────
    // This replaces the hard-coded product cards in the original products.html
    // with dynamic data coming from GET /api/products in server.js.
    //
    // In the future you would connect server.js to Oracle and run:
    //   SELECT * FROM products
    // The API would return the same JSON shape, so this code needs no changes.
    async function loadProducts() {

      try {
        // Send a GET request to our Node.js API
        const response = await fetch("/api/products");

        // Convert the response body from JSON text to a JS object
        const data = await response.json();

        // If the request failed or returned no products, show a message
        if (!data.success || !data.products.length) {
          document.getElementById("loadingMsg").textContent = "No products found.";
          return;
        }

        // Find the grid container where we'll put the product cards
        const grid = document.getElementById("productGrid");

        // Remove the "Loading..." placeholder
        grid.innerHTML = "";

        // Filter categories to cycle through for variety (mirrors original HTML classes)
        const filterClasses = ["all des", "all dev", "all gra"];

        // Loop through each product and build an HTML card for it
        data.products.forEach((product, index) => {
        const filterClass = filterClasses[index % filterClasses.length];
        const stars = '<li><i class="fa fa-star"></i></li>'.repeat(5);

        const cardHTML = `
          <div class="col-lg-4 col-md-4 ${filterClass}">
            <div class="product-item">
              <a href="/product_details?product_id=${product.product_id}">
                <img src="assets/images/${product.image}" alt="${product.name}">
              </a>
              <div class="down-content">
                <a href="/product_details?product_id=${product.product_id}"><h4>${product.name}</h4></a>
                <h6>$${(product.price ?? 0).toFixed(2)}</h6>
                <p>${product.description}</p>
                <ul class="stars">${stars}</ul>
                <span>Stock: ${product.stock} units</span>
                <button class="btn btn-primary add-to-cart-btn" data-id="${product.product_id}">
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
        `;

        grid.insertAdjacentHTML("beforeend", cardHTML);

        const newCard = grid.lastElementChild.querySelector(".add-to-cart-btn");

        if ((product.stock ?? 0) <= 0) {
          newCard.disabled = true;
          newCard.textContent = "Out of Stock";
        }

        newCard.addEventListener("click", () => {
          try {
            addToCart(product, 1);
            alert(`${product.name} added to cart.`);
          } catch (err) {
            alert(err.message);
          }
        });
      });

        // Re-initialise Isotope after adding dynamic content.
        // Isotope needs to know about the new cards so its filter/sort works.
        // We use a short timeout to let the browser render the cards first.
        setTimeout(() => {
          const $grid = $(".grid");
          if ($grid.length && typeof $.fn.isotope !== "undefined") {
            $grid.isotope({ itemSelector: "[class*='col-']", layoutMode: "fitRows" });
          }
        }, 200);

      } catch (err) {
        // Show an error if the network or server failed
        document.getElementById("loadingMsg").textContent =
          "Failed to load products. Is the server running?";
        console.error("Products fetch error:", err);
      }

      // Wire up the button after inserting (since cardHTML is a string, not yet in DOM-aware scope)
      const newCard = grid.lastElementChild.querySelector(".add-to-cart-btn");

      // ── Disable the button up front if there's no stock ───────────
      // Mirrors product_details.html, which disables #addToCartBtn
      // when product.stock <= 0.
      if ((product.stock ?? 0) <= 0) {
        newCard.disabled = true;
        newCard.textContent = "Out of Stock";
      }

      newCard.addEventListener("click", () => {
        // addToCart() now throws if the product is out of stock, or if
        // adding 1 more would exceed available stock - catch that here
        // so the page doesn't break with an uncaught error.
        try {
          addToCart(product, 1);
          alert(`${product.name} added to cart.`);
        } catch (err) {
          alert(err.message);
        }
      });
    }


    // ── Run on page load ─────────────────────────────────────────────────
    // Call loadProducts() as soon as the page's DOM is ready
    document.addEventListener("DOMContentLoaded", loadProducts);

  </script>

</body>
</html>
