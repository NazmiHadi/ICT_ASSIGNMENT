    <style>
      :root {
        --bg:        #FAF7F2;
        --sidebar:   #2B2118;
        --sidebar-hover: #3B2E22;
        --accent:    #A8333D;
        --accent-soft: #F3E3DD;

      .shell { display: flex; min-height: 100vh; }

        padding: 28px 0;
        position: sticky;
        top: 0;
        height: 100vh;
      }

      .sidebar-brand {
        padding: 0 28px 28px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        margin-bottom: 20px;

      .sidebar-brand .mark {
        font-size: 11px;

      .sidebar-nav { list-style: none; margin: 0; padding: 0; flex: 1; }

      .sidebar-nav li a {

        width: 100%;

      .form-control:focus {
        outline: none;

      .btn-primary {
        background: var(--accent);

        border: none;
        border-radius: 6px;

        transition: background 0.15s ease;

      /* ---------- Table ---------- */
      .table-wrapper { overflow-x: auto; }
      table.worker-table { width: 100%; border-collapse: collapse; }

      /* ---------- Alert ---------- */
      #formAlert {

      #formAlert.success { background: #E8F5EA; color: #1C7A3D; border: 1px solid #BFE6C8; }

      @media (max-width: 900px) {

      @media (max-width: 860px) {
        .shell { flex-direction: column; }

          width: 100%; height: auto; position: relative;

        .sidebar-nav { display: flex; flex: none; }
        .sidebar-nav li a { padding: 8px 16px; border-left: none; border-bottom: 3px solid transparent; }
        .sidebar-nav li a.active { border-left: none; border-bottom-color: var(--accent); }

  </head>

  <body>

    <div class="shell">

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <p class="mark">Admin Panel</p>
          <h2>KURMA <em>AJWA</em></h2>
        </div>

        <ul class="sidebar-nav">
          <li><a href="dashboard"><i class="fa fa-th-large"></i> Dashboard</a></li>
          <li><a href="workers" class="active"><i class="fa fa-users"></i> Manage Workers</a></li>
          <li><a href="orders"><i class="fa fa-list-alt"></i> Manage Orders</a></li>
          <li><a href="purchase"><i class="fa fa-shopping-cart"></i> Manage Purchases</a></li>
        </ul>

        <div class="sidebar-footer">
          <a href="#" onclick="logout()"><i class="fa fa-sign-out"></i> Logout</a>
        </div>
      </aside>

      <!-- Main content -->
      <main class="main">

        <div class="page-head">
          <p class="eyebrow">Team</p>
          <h1>Manage Workers</h1>
          <p>Add new workers and view everyone currently registered.</p>
        </div>

        <div id="formAlert"></div>

        <div class="card-grid">
          <div class="panel">
            <h3>Add New Worker</h3>
            <form id="workerForm">
              <div class="form-group">
                <label for="workName">Worker Name</label>
                <input type="text" class="form-control" id="workName" name="workName" placeholder="e.g. Ahmad bin Ismail" required>
              </div>
              <div class="form-group">
                <label for="workPhoneNum">Phone Number</label>
                <input type="text" class="form-control" id="workPhoneNum" name="workPhoneNum" placeholder="e.g. 012-3456789">
              </div>
              <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Login username" required>
              </div>
              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Login password" required>
              </div>
              <div class="form-group">
                <label for="managerId">Manager (optional)</label>
                <select class="form-control" id="managerId" name="managerId">
                  <option value="">No manager / Top level</option>
                </select>
              </div>
              <button type="submit" class="btn-primary">Add Worker</button>
            </form>
          </div>

          <div class="panel">
            <h3>Registered Workers</h3>
            <div class="table-wrapper">
              <table class="worker-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Username</th>
                    <th>Manager</th>
                  </tr>
                </thead>
                <tbody id="workerTableBody">
                  <tr><td colspan="5">Loading workers...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </main>

    </div>

    <!-- Bootstrap core JavaScript -->
    <script src="/admin/vendor/jquery/jquery.min.js"></script>
    <script src="/admin/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
      function logout() {
        localStorage.removeItem("role");
        window.location.href = "../login.html";
      }

      const API_BASE = "/api/workers";

      function showAlert(message, type) {
        const alertBox = document.getElementById("formAlert");
        alertBox.textContent = message;
        alertBox.className = type; // 'success' or 'error'
        alertBox.style.display = "block";
        setTimeout(() => { alertBox.style.display = "none"; }, 4000);
      }

      async function loadWorkers() {
        const tableBody = document.getElementById("workerTableBody");
        const managerSelect = document.getElementById("managerId");

        try {
          const res = await fetch(API_BASE);
          const data = await res.json();

          if (!res.ok || !data.success) {
            throw new Error(data.message || "Request failed");
          }

          const workers = data.workers || [];

          if (workers.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5">No workers registered yet.</td></tr>';
          } else {
            tableBody.innerHTML = workers.map(w => `
              <tr>
                <td>${w.worker_id}</td>
                <td>${w.name}</td>
                <td>${w.phone || "-"}</td>
                <td>${w.username}</td>
                <td>${w.manager_name || "-"}</td>
              </tr>
            `).join("");
          }

          // Repopulate manager dropdown (keep the default option)
          managerSelect.innerHTML = '<option value="">No manager / Top level</option>' +
            workers.map(w => `<option value="${w.worker_id}">${w.name}</option>`).join("");

        } catch (err) {
          console.error(err);
          tableBody.innerHTML = '<tr><td colspan="5">Failed to load workers. Please refresh.</td></tr>';
        }
      }

      document.getElementById("workerForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const payload = {
          name: document.getElementById("workName").value.trim(),
          phone: document.getElementById("workPhoneNum").value.trim(),
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
          manager_id: document.getElementById("managerId").value || null,
        };

        try {
          const res = await fetch(API_BASE, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            showAlert(data.message || "Failed to add worker.", "error");
            return;
          }

          showAlert(data.message || "Worker added successfully.", "success");
          document.getElementById("workerForm").reset();
          loadWorkers();

        } catch (err) {
          console.error(err);
          showAlert("Something went wrong. Please try again.", "error");
        }
      });

      loadWorkers();
    </script>

  </body>

</html>
