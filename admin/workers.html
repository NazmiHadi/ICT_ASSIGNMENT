<script>window.PAGE_KEY = "workers";</script>
<script src="/admin/assets/js/role-config.js"></script>
<script src="/admin/assets/js/page-guard.js"></script>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800&display=swap" rel="stylesheet">
  <title>KURMA AJWA ENTERPRISE | Manage Workers</title>
  <link href="/admin/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/css/fontawesome.css">
  <style>
    :root { --bg:#FAF7F2; --sidebar:#2B2118; --sidebar-hover:#3B2E22; --accent:#A8333D; --accent-soft:#F3E3DD; --ink:#2B2118; --ink-soft:#8A7B6C; --line:#E8E1D8; --card:#FFFFFF; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Poppins',sans-serif; background:var(--bg); color:var(--ink); }
    .shell { display:flex; min-height:100vh; }
    .sidebar { width:260px; flex-shrink:0; background:var(--sidebar); color:#EDE6DC; display:flex; flex-direction:column; padding:28px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
    .sidebar-brand { padding:0 28px 28px; border-bottom:1px solid rgba(255,255,255,0.08); margin-bottom:20px; }
    .sidebar-brand .mark { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#C9A98A; margin:0 0 4px; }
    .sidebar-brand h2 { font-size:21px; font-weight:700; margin:0; line-height:1.25; }
    .sidebar-brand h2 em { font-style:normal; color:var(--accent); }
    .sidebar-nav { list-style:none; margin:0; padding:0; flex:1; }
    .sidebar-nav .nav-group-label { padding:16px 28px 6px; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:#8A7B6C; font-weight:600; }
    .sidebar-nav li a { display:flex; align-items:center; gap:12px; padding:13px 28px; color:#C9BFB2; text-decoration:none; font-size:14.5px; font-weight:500; border-left:3px solid transparent; transition:background .15s,color .15s; }
    .sidebar-nav li a i { width:18px; text-align:center; font-size:14px; }
    .sidebar-nav li a:hover { background:var(--sidebar-hover); color:#fff; }
    .sidebar-nav li a.active { background:var(--sidebar-hover); color:#fff; border-left-color:var(--accent); }
    .sidebar-footer { padding:0 28px; margin-top:12px; }
    .sidebar-footer a { display:flex; align-items:center; gap:10px; color:#C9BFB2; text-decoration:none; font-size:14px; padding:10px 0; border-top:1px solid rgba(255,255,255,0.08); }
    .sidebar-footer a:hover { color:#fff; }
    .main { flex:1; padding:40px 48px 60px; max-width:1200px; }
    .page-head { margin-bottom:32px; }
    .page-head .eyebrow { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 6px; }
    .page-head h1 { font-size:28px; font-weight:700; margin:0 0 6px; }
    .page-head p { margin:0; color:var(--ink-soft); font-size:14.5px; }
    .two-col { display:grid; grid-template-columns:minmax(300px,400px) 1fr; gap:24px; align-items:start; }
    .panel { background:var(--card); border-radius:10px; padding:28px; box-shadow:0 1px 3px rgba(43,33,24,0.06); margin-bottom:24px; }
    .panel h3 { font-size:16px; font-weight:600; margin:0 0 20px; }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-weight:500; font-size:13.5px; margin-bottom:5px; }
    .form-control { width:100%; border:1px solid var(--line); border-radius:6px; padding:10px 12px; font-size:14px; font-family:'Poppins',sans-serif; color:var(--ink); background:#fff; }
    .form-control:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .salary-section { display:none; background:#FBF8F4; border-radius:8px; padding:14px; margin-bottom:14px; }
    .salary-section.show { display:block; }
    .salary-section .section-label { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin:0 0 10px; }
    .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
    .badge-ft { background:#E8F5EA; color:#1C7A3D; }
    .badge-pt { background:#FBF1DC; color:#91701C; }
    .badge-na { background:#F0EDE8; color:#8A7B6C; }
    .btn-primary { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:11px 22px; font-size:14px; font-weight:600; cursor:pointer; transition:background .15s; width:100%; font-family:'Poppins',sans-serif; margin-top:6px; }
    .btn-primary:hover { background:#8E2A33; }
    .table-wrapper { overflow-x:auto; }
    table.worker-table { width:100%; border-collapse:collapse; }
    table.worker-table th, table.worker-table td { padding:11px 13px; text-align:left; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
    table.worker-table th { background:#FBF8F4; font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.5px; color:var(--ink-soft); }
    table.worker-table tbody tr:hover { background:#FBF8F4; }
    #formAlert { display:none; margin-bottom:20px; padding:12px 16px; border-radius:6px; font-size:14px; }
    #formAlert.success { background:#E8F5EA; color:#1C7A3D; border:1px solid #BFE6C8; }
    #formAlert.error { background:#FBE9E7; color:#A8333D; border:1px solid #EFC2BD; }
    @media (max-width:900px) { .two-col { grid-template-columns:1fr; } }
    @media (max-width:860px) {
      .shell { flex-direction:column; }
      .sidebar { width:100%; height:auto; position:relative; flex-direction:row; align-items:center; padding:14px 20px; overflow-x:auto; }
      .sidebar-brand { display:none; }
      .sidebar-nav { display:flex; flex:none; }
      .sidebar-nav li a { padding:8px 16px; border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
      .sidebar-nav li a.active { border-left:none; border-bottom-color:var(--accent); }
      .sidebar-footer { display:none; }
      .main { padding:28px 20px 40px; }
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <p class="mark">Admin Panel</p>
      <h2>KURMA <em>AJWA</em></h2>
    </div>
      <ul class="sidebar-nav" id="sidebarNav"></ul>
    <div class="sidebar-footer">
      <a href="#" onclick="logout()"><i class="fa fa-sign-out"></i> Logout</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <p class="eyebrow">Team</p>
      <h1>Manage Workers</h1>
      <p>Add new workers and view everyone currently registered.</p>
    </div>

    <div id="formAlert"></div>

    <div class="two-col">
      <div class="panel">
        <h3>Add New Worker</h3>
        <form id="workerForm">
          <div class="form-group">
            <label>Worker Name</label>
            <input type="text" class="form-control" id="workName" placeholder="e.g. Ahmad bin Ismail" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" class="form-control" id="workPhone" placeholder="e.g. 012-3456789">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Username</label>
              <input type="text" class="form-control" id="username" placeholder="Login username" required>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
          </div>
          <div class="form-group">
            <label>Manager (optional)</label>
            <select class="form-control" id="managerId">
              <option value="">No manager / Top level</option>
            </select>
          </div>
          <div class="form-group">
            <label>Worker Type</label>
            <select class="form-control" id="workType" onchange="toggleSalaryFields()" required>
              <option value="">Select type...</option>
              <option value="Full Time">Full Time</option>
              <option value="Part Time">Part Time</option>
            </select>
          </div>

          <!-- Full Time salary fields -->
          <div class="salary-section" id="ftSection">
            <p class="section-label">Full Time Details</p>
            <div class="form-row">
              <div class="form-group" style="margin-bottom:0">
                <label>Salary (RM)</label>
                <input type="number" class="form-control" id="salary" placeholder="e.g. 2500" min="0" step="0.01">
              </div>
              <div class="form-group" style="margin-bottom:0">
                <label>Bonus Salary (RM)</label>
                <input type="number" class="form-control" id="bonusSalary" placeholder="e.g. 500" min="0" step="0.01">
              </div>
            </div>
          </div>

          <!-- Part Time salary fields -->
          <div class="salary-section" id="ptSection">
            <p class="section-label">Part Time Details</p>
            <div class="form-group" style="margin-bottom:0">
              <label>Salary Per Hour (RM)</label>
              <input type="number" class="form-control" id="salaryPerHr" placeholder="e.g. 8.50" min="0" step="0.01">
            </div>
          </div>

          <button type="submit" class="btn-primary">Add Worker</button>
        </form>
      </div>

      <div class="panel">
        <h3>Registered Workers</h3>
        <div class="table-wrapper">
          <table class="worker-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Username</th>
                <th>Type</th>
                <th>Salary</th>
                <th>Manager</th>
              </tr>
            </thead>
            <tbody id="workerTableBody">
              <tr><td colspan="7">Loading workers...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/admin/vendor/jquery/jquery.min.js"></script>
<script src="/admin/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
  function logout() { localStorage.removeItem("role"); window.location.href = "/"; }

  function toggleSalaryFields() {
    const type = document.getElementById("workType").value;
    document.getElementById("ftSection").classList.toggle("show", type === "Full Time");
    document.getElementById("ptSection").classList.toggle("show", type === "Part Time");
  }

  function showAlert(msg, type) {
    const box = document.getElementById("formAlert");
    box.textContent = msg; box.className = type; box.style.display = "block";
    setTimeout(() => { box.style.display = "none"; }, 4000);
  }

  function salaryDisplay(w) {
    if (w.work_type === "Full Time") {
      let s = `RM ${Number(w.salary || 0).toFixed(2)}`;
      if (w.bonus_salary) s += ` + Bonus RM ${Number(w.bonus_salary).toFixed(2)}`;
      return s;
    }
    if (w.work_type === "Part Time") return `RM ${Number(w.salary_per_hr || 0).toFixed(2)}/hr`;
    return "-";
  }

  function badgeHtml(type) {
    if (type === "Full Time") return `<span class="badge badge-ft">Full Time</span>`;
    if (type === "Part Time") return `<span class="badge badge-pt">Part Time</span>`;
    return `<span class="badge badge-na">-</span>`;
  }

  async function loadWorkers() {
    const tbody = document.getElementById("workerTableBody");
    const mgSel = document.getElementById("managerId");
    try {
      const res  = await fetch("/api/workers");
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message);

      const workers = data.workers || [];
      tbody.innerHTML = workers.length === 0
        ? '<tr><td colspan="7">No workers registered yet.</td></tr>'
        : workers.map(w => `
            <tr>
              <td>${w.worker_id}</td>
              <td>${w.name}</td>
              <td>${w.phone || "-"}</td>
              <td>${w.username}</td>
              <td>${badgeHtml(w.work_type)}</td>
              <td>${salaryDisplay(w)}</td>
              <td>${w.manager_name || "-"}</td>
            </tr>`).join("");

      mgSel.innerHTML = '<option value="">No manager / Top level</option>' +
        workers.map(w => `<option value="${w.worker_id}">${w.name}</option>`).join("");

    } catch (err) {
      console.error(err);
      tbody.innerHTML = '<tr><td colspan="7">Failed to load workers. Please refresh.</td></tr>';
    }
  }

  document.getElementById("workerForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const work_type = document.getElementById("workType").value;
    const payload = {
      name:         document.getElementById("workName").value.trim(),
      phone:        document.getElementById("workPhone").value.trim(),
      username:     document.getElementById("username").value.trim(),
      password:     document.getElementById("password").value,
      manager_id:   document.getElementById("managerId").value || null,
      work_type,
      salary:       document.getElementById("salary").value || null,
      bonus_salary: document.getElementById("bonusSalary").value || null,
      salary_per_hr: document.getElementById("salaryPerHr").value || null,
    };

    try {
      const res  = await fetch("/api/workers", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok || !data.success) { showAlert(data.message || "Failed to add worker.", "error"); return; }
      showAlert(data.message || "Worker added successfully.", "success");
      document.getElementById("workerForm").reset();
      toggleSalaryFields();
      loadWorkers();
    } catch (err) {
      console.error(err);
      showAlert("Something went wrong. Please try again.", "error");
    }
  });

  loadWorkers();
</script>
</body>
</html>
