<script>window.PAGE_KEY = "profile";</script>
<script src="/admin/assets/js/role-config.js"></script>
<script src="/admin/assets/js/page-guard.js"></script>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800&display=swap" rel="stylesheet">
  <title>KURMA AJWA ENTERPRISE | My Profile</title>
  <link href="/admin/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/css/fontawesome.css">
  <style>
    :root { --bg:#FAF7F2; --sidebar:#2B2118; --sidebar-hover:#3B2E22; --accent:#A8333D; --accent-soft:#F3E3DD; --ink:#2B2118; --ink-soft:#8A7B6C; --line:#E8E1D8; --card:#FFFFFF; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Poppins',sans-serif; background:var(--bg); color:var(--ink); }
    .shell { display:flex; min-height:100vh; }
    .sidebar { width:260px; flex-shrink:0; background:var(--sidebar); color:#EDE6DC; display:flex; flex-direction:column; padding:28px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
    .sidebar-brand { padding:0 28px 28px; border-bottom:1px solid rgba(255,255,255,0.08); margin-bottom:20px; }
    .sidebar-brand .mark { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#C9A98A; margin:0 0 4px; }
    .sidebar-brand h2 { font-size:21px; font-weight:700; margin:0; line-height:1.25; }
    .sidebar-brand h2 em { font-style:normal; color:var(--accent); }
    .sidebar-brand .role-pill { display:inline-block; margin-top:10px; padding:4px 10px; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; font-weight:600; color:#EDE6DC; background:rgba(168,51,61,0.35); border:1px solid rgba(168,51,61,0.6); border-radius:20px; }
    .sidebar-nav { list-style:none; margin:0; padding:0; flex:1; }
    .sidebar-nav .nav-group-label { padding:16px 28px 6px; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:#8A7B6C; font-weight:600; }
    .sidebar-nav li a { display:flex; align-items:center; gap:12px; padding:13px 28px; color:#C9BFB2; text-decoration:none; font-size:14.5px; font-weight:500; border-left:3px solid transparent; transition:background .15s,color .15s; }
    .sidebar-nav li a i { width:18px; text-align:center; font-size:14px; }
    .sidebar-nav li a:hover { background:var(--sidebar-hover); color:#fff; }
    .sidebar-nav li a.active { background:var(--sidebar-hover); color:#fff; border-left-color:var(--accent); }
    .sidebar-footer { padding:0 28px; margin-top:12px; }
    .sidebar-footer a { display:flex; align-items:center; gap:10px; color:#C9BFB2; text-decoration:none; font-size:14px; padding:10px 0; border-top:1px solid rgba(255,255,255,0.08); }
    .sidebar-footer a:hover { color:#fff; }
    .main { flex:1; padding:40px 48px 60px; max-width:900px; }
    .page-head { margin-bottom:32px; }
    .page-head .eyebrow { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 6px; }
    .page-head h1 { font-size:28px; font-weight:700; margin:0 0 6px; }
    .page-head p { margin:0; color:var(--ink-soft); font-size:14.5px; }
    .panel { background:var(--card); border-radius:10px; padding:28px; box-shadow:0 1px 3px rgba(43,33,24,0.06); margin-bottom:24px; }
    .panel h3 { font-size:16px; font-weight:600; margin:0 0 4px; }
    .panel .panel-sub { font-size:13px; color:var(--ink-soft); margin:0 0 20px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .form-group { margin-bottom:16px; }
    .form-group.full { grid-column:1 / -1; }
    .form-group label { display:block; font-weight:500; font-size:13.5px; margin-bottom:6px; }
    .form-control { width:100%; border:1px solid var(--line); border-radius:6px; padding:10px 12px; font-size:14px; font-family:'Poppins',sans-serif; color:var(--ink); background:#fff; }
    .form-control:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .form-control:disabled { background:#F5F1EA; color:var(--ink-soft); cursor:not-allowed; }
    .hint { font-size:12px; color:var(--ink-soft); margin-top:4px; }
    .divider { border:none; border-top:1px solid var(--line); margin:24px 0; }
    .btn-primary { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:11px 26px; font-size:14px; font-weight:600; cursor:pointer; transition:background .15s; font-family:'Poppins',sans-serif; }
    .btn-primary:hover { background:#8E2A33; }
    .readonly-card { background:#FBF8F4; border-radius:8px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:13.5px; }
    .readonly-card span:first-child { color:var(--ink-soft); }
    .readonly-card span:last-child { font-weight:600; }
    #formAlert { display:none; margin-bottom:20px; padding:12px 16px; border-radius:6px; font-size:14px; }
    #formAlert.success { background:#E8F5EA; color:#1C7A3D; border:1px solid #BFE6C8; }
    #formAlert.error { background:#FBE9E7; color:#A8333D; border:1px solid #EFC2BD; }
    @media (max-width:700px) { .form-row { grid-template-columns:1fr; } }
    @media (max-width:860px) {
      .shell { flex-direction:column; }
      .sidebar { width:100%; height:auto; position:relative; flex-direction:row; align-items:center; padding:14px 20px; overflow-x:auto; }
      .sidebar-brand { display:none; }
      .sidebar-nav .nav-group-label { display:none; }
      .sidebar-nav { display:flex; flex:none; }
      .sidebar-nav li a { padding:8px 16px; border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
      .sidebar-nav li a.active { border-left:none; border-bottom-color:var(--accent); }
      .sidebar-footer { display:none; }
      .main { padding:28px 20px 40px; }
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <p class="mark">Admin Panel</p>
      <h2>KURMA <em>AJWA</em></h2>
      <span class="role-pill" id="rolePill">—</span>
    </div>
    <ul class="sidebar-nav" id="sidebarNav"></ul>
    <div class="sidebar-footer">
      <a href="#" id="logoutLink"><i class="fa fa-sign-out"></i> Logout</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <p class="eyebrow">Account</p>
      <h1>My Profile</h1>
      <p>View and update your personal information, username, and password.</p>
    </div>

    <div id="formAlert"></div>

    <!-- Employment info (workers only, read-only) -->
    <div class="panel" id="employmentPanel" style="display:none;">
      <h3>Employment Details</h3>
      <p class="panel-sub">Set by an administrator — contact your manager to change these.</p>
      <div id="employmentInfo"></div>
    </div>

    <div class="panel">
      <h3>Edit Profile</h3>
      <p class="panel-sub">Loading your information...</p>
      <form id="profileForm" style="display:none;">
        <div class="form-row" id="fieldsRow"></div>
        <hr class="divider">
        <div class="form-row">
          <div class="form-group">
            <label>New Password</label>
            <input type="password" class="form-control" id="password" placeholder="Leave blank to keep current password">
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter new password">
          </div>
        </div>
        <button type="submit" class="btn-primary">Save Changes</button>
      </form>
    </div>
  </main>
</div>

<script src="/admin/vendor/jquery/jquery.min.js"></script>
<script src="/admin/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
  function logout() { localStorage.removeItem("role"); window.location.href = "/"; }


  // Maps the app's localStorage "role" to the DB-facing role key
  // used by /api/profile (worker roles all read/write the WORKERS table,
  // but admin/fulltime/parttime differ in which extra fields they show).
  function apiRoleFor(role) {
    return role; // admin/fulltime/parttime/vendor/customer all map 1:1 here
  }

  function showAlert(msg, type) {
    const box = document.getElementById("formAlert");
    box.textContent = msg; box.className = type; box.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
    setTimeout(() => { box.style.display = "none"; }, 4500);
  }

  // Field definitions per role — controls what shows in the edit form
  function fieldsFor(role, profile) {
    const common = [
      { id: "name", label: "Full Name", value: profile.name, required: true },
      { id: "username", label: "Username", value: profile.username, required: true }
    ];

    if (role === "admin" || role === "fulltime" || role === "parttime") {
      return [
        ...common,
        { id: "phone", label: "Phone Number", value: profile.phone || "" }
      ];
    }
    if (role === "vendor") {
      return [
        ...common,
        { id: "phone", label: "Phone Number", value: profile.phone || "" },
        { id: "address", label: "Address", value: profile.address || "", full: true }
      ];
    }
    // customer
    return [
      ...common,
      { id: "email", label: "Email", value: profile.email || "" },
      { id: "phone", label: "Phone Number", value: profile.phone || "" },
      { id: "address", label: "Address", value: profile.address || "", full: true }
    ];
  }

  async function loadProfile() {
    const role = localStorage.getItem("role");
    const id   = localStorage.getItem("userId");

    if (!id) {
      document.querySelector(".panel-sub").textContent =
        "Could not identify your account. Please log out and log back in.";
      return;
    }

    try {
      const res  = await fetch(`/api/profile?role=${encodeURIComponent(apiRoleFor(role))}&id=${encodeURIComponent(id)}`);
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message);

      const profile = data.profile;

      // Employment panel (full-time / part-time / admin only)
      if (role === "fulltime" || role === "parttime" || role === "admin") {
        const panel = document.getElementById("employmentPanel");
        const info  = document.getElementById("employmentInfo");
        let rows = `<div class="readonly-card"><span>Role</span><span>${
          profile.isManager ? "Manager" : (role === "fulltime" ? "Full-Time Worker" : "Part-Time Worker")
        }</span></div>`;
        if (profile.salary != null) rows += `<div class="readonly-card"><span>Base Salary</span><span>RM ${Number(profile.salary).toFixed(2)}</span></div>`;
        if (profile.bonusSalary != null) rows += `<div class="readonly-card"><span>Bonus Salary</span><span>RM ${Number(profile.bonusSalary).toFixed(2)}</span></div>`;
        if (profile.salaryPerHr != null) rows += `<div class="readonly-card"><span>Salary per Hour</span><span>RM ${Number(profile.salaryPerHr).toFixed(2)}</span></div>`;
        info.innerHTML = rows;
        panel.style.display = "block";
      }

      // Build editable form
      const fields = fieldsFor(role, profile);
      const fieldsRow = document.getElementById("fieldsRow");
      fieldsRow.innerHTML = fields.map(f => `
        <div class="form-group ${f.full ? "full" : ""}">
          <label>${f.label}${f.required ? "" : ""}</label>
          <input type="text" class="form-control" id="${f.id}" value="${(f.value || "").replace(/"/g, "&quot;")}" ${f.required ? "required" : ""}>
        </div>
      `).join("");

      document.querySelector(".panel-sub").remove();
      document.getElementById("profileForm").style.display = "block";
      document.getElementById("profileForm").dataset.fieldIds = fields.map(f => f.id).join(",");

    } catch (err) {
      console.error(err);
      showAlert("Failed to load your profile. Please refresh.", "error");
    }
  }

  document.getElementById("profileForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const role = localStorage.getItem("role");
    const id   = localStorage.getItem("userId");
    const fieldIds = this.dataset.fieldIds.split(",");

    const payload = { role: apiRoleFor(role), id };
    fieldIds.forEach(fid => {
      payload[fid] = document.getElementById(fid).value.trim();
    });

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    if (password || confirmPassword) {
      payload.password = password;
      payload.confirmPassword = confirmPassword;
    }

    try {
      const res  = await fetch("/api/profile", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok || !data.success) { showAlert(data.message || "Failed to update profile.", "error"); return; }

      showAlert(data.message || "Profile updated successfully.", "success");
      document.getElementById("password").value = "";
      document.getElementById("confirmPassword").value = "";
    } catch (err) {
      console.error(err);
      showAlert("Something went wrong. Please try again.", "error");
    }
  });

  loadProfile();
</script>
</body>
</html>
