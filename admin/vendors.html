<script>
const role = localStorage.getItem("role");
if (role !== "admin") { window.location.href = "../login.html"; }
</script>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800&display=swap" rel="stylesheet">
  <title>KURMA AJWA ENTERPRISE | Manage Vendors</title>
  <link href="/admin/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/css/fontawesome.css">
  <style>
    :root { --bg:#FAF7F2; --sidebar:#2B2118; --sidebar-hover:#3B2E22; --accent:#A8333D; --accent-soft:#F3E3DD; --ink:#2B2118; --ink-soft:#8A7B6C; --line:#E8E1D8; --card:#FFFFFF; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Poppins',sans-serif; background:var(--bg); color:var(--ink); }
    .shell { display:flex; min-height:100vh; }
    .sidebar { width:260px; flex-shrink:0; background:var(--sidebar); color:#EDE6DC; display:flex; flex-direction:column; padding:28px 0; position:sticky; top:0; height:100vh; }
    .sidebar-brand { padding:0 28px 28px; border-bottom:1px solid rgba(255,255,255,0.08); margin-bottom:20px; }
    .sidebar-brand .mark { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#C9A98A; margin:0 0 4px; }
    .sidebar-brand h2 { font-size:21px; font-weight:700; margin:0; line-height:1.25; }
    .sidebar-brand h2 em { font-style:normal; color:var(--accent); }
    .sidebar-nav { list-style:none; margin:0; padding:0; flex:1; }
    .sidebar-nav li a { display:flex; align-items:center; gap:12px; padding:13px 28px; color:#C9BFB2; text-decoration:none; font-size:14.5px; font-weight:500; border-left:3px solid transparent; transition:background .15s,color .15s; }
    .sidebar-nav li a i { width:18px; text-align:center; font-size:14px; }
    .sidebar-nav li a:hover { background:var(--sidebar-hover); color:#fff; }
    .sidebar-nav li a.active { background:var(--sidebar-hover); color:#fff; border-left-color:var(--accent); }
    .sidebar-footer { padding:0 28px; margin-top:12px; }
    .sidebar-footer a { display:flex; align-items:center; gap:10px; color:#C9BFB2; text-decoration:none; font-size:14px; padding:10px 0; border-top:1px solid rgba(255,255,255,0.08); }
    .sidebar-footer a:hover { color:#fff; }
    .main { flex:1; padding:40px 48px 60px; }
    .page-head { margin-bottom:32px; }
    .page-head .eyebrow { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 6px; }
    .page-head h1 { font-size:28px; font-weight:700; margin:0 0 6px; }
    .page-head p { margin:0; color:var(--ink-soft); font-size:14.5px; }
    .two-col { display:grid; grid-template-columns:minmax(280px,360px) 1fr; gap:24px; align-items:start; }
    .panel { background:var(--card); border-radius:10px; padding:28px; box-shadow:0 1px 3px rgba(43,33,24,0.06); }
    .panel h3 { font-size:16px; font-weight:600; margin:0 0 20px; }
    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-weight:500; font-size:13.5px; margin-bottom:5px; }
    .form-control { width:100%; border:1px solid var(--line); border-radius:6px; padding:10px 12px; font-size:14px; font-family:'Poppins',sans-serif; color:var(--ink); background:#fff; }
    .form-control:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .btn-primary { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:11px 22px; font-size:14px; font-weight:600; cursor:pointer; transition:background .15s; width:100%; font-family:'Poppins',sans-serif; margin-top:6px; }
    .btn-primary:hover { background:#8E2A33; }
    .table-wrapper { overflow-x:auto; }
    table.vendor-table { width:100%; border-collapse:collapse; }
    table.vendor-table th, table.vendor-table td { padding:12px 14px; text-align:left; border-bottom:1px solid var(--line); font-size:14px; }
    table.vendor-table th { background:#FBF8F4; font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.5px; color:var(--ink-soft); }
    table.vendor-table tbody tr:hover { background:#FBF8F4; }
    #formAlert { display:none; margin-bottom:20px; padding:12px 16px; border-radius:6px; font-size:14px; }
    #formAlert.success { background:#E8F5EA; color:#1C7A3D; border:1px solid #BFE6C8; }
    #formAlert.error { background:#FBE9E7; color:#A8333D; border:1px solid #EFC2BD; }
    @media (max-width:900px) { .two-col { grid-template-columns:1fr; } }
    @media (max-width:860px) {
      .shell { flex-direction:column; }
      .sidebar { width:100%; height:auto; position:relative; flex-direction:row; align-items:center; padding:14px 20px; overflow-x:auto; }
      .sidebar-brand { display:none; }
      .sidebar-nav { display:flex; flex:none; }
      .sidebar-nav li a { padding:8px 16px; border-left:none; border-bottom:3px solid transparent; }
      .sidebar-nav li a.active { border-left:none; border-bottom-color:var(--accent); }
      .sidebar-footer { display:none; }
      .main { padding:28px 20px 40px; }
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <p class="mark">Admin Panel</p>
      <h2>KURMA <em>AJWA</em></h2>
    </div>
    <ul class="sidebar-nav">
      <li><a href="dashboard"><i class="fa fa-th-large"></i> Dashboard</a></li>
      <li><a href="workers"><i class="fa fa-users"></i> Manage Workers</a></li>
      <li><a href="orders"><i class="fa fa-list-alt"></i> Manage Orders</a></li>
      <li><a href="purchase"><i class="fa fa-shopping-cart"></i> Manage Purchases</a></li>
      <li><a href="vendors" class="active"><i class="fa fa-building"></i> Manage Vendors</a></li>
    </ul>
    <div class="sidebar-footer">
      <a href="#" onclick="logout()"><i class="fa fa-sign-out"></i> Logout</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <p class="eyebrow">Suppliers</p>
      <h1>Manage Vendors</h1>
      <p>Add new vendors and view all registered suppliers.</p>
    </div>

    <div id="formAlert"></div>

    <div class="two-col">
      <div class="panel">
        <h3>Add New Vendor</h3>
        <form id="vendorForm">
          <div class="form-group">
            <label>Vendor Name</label>
            <input type="text" class="form-control" id="vendName" placeholder="e.g. Ajwa Supplier Sdn Bhd" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" class="form-control" id="vendPhone" placeholder="e.g. 03-12345678">
          </div>
          <div class="form-group">
            <label>Address</label>
            <textarea class="form-control" id="vendAddress" placeholder="e.g. No 1, Jalan Kurma, 40000 Shah Alam" rows="3" style="resize:vertical;"></textarea>
          </div>
          <button type="submit" class="btn-primary">Add Vendor</button>
        </form>
      </div>

      <div class="panel">
        <h3>Registered Vendors</h3>
        <div class="table-wrapper">
          <table class="vendor-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Address</th>
              </tr>
            </thead>
            <tbody id="vendorTableBody">
              <tr><td colspan="4">Loading vendors...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/admin/vendor/jquery/jquery.min.js"></script>
<script src="/admin/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
  function logout() { localStorage.removeItem("role"); window.location.href = "../login.html"; }

  function showAlert(msg, type) {
    const box = document.getElementById("formAlert");
    box.textContent = msg; box.className = type; box.style.display = "block";
    setTimeout(() => { box.style.display = "none"; }, 4000);
  }

  async function loadVendors() {
    const tbody = document.getElementById("vendorTableBody");
    try {
      const res  = await fetch("/api/vendors");
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message);
      const vendors = data.vendors || [];
      tbody.innerHTML = vendors.length === 0
        ? '<tr><td colspan="4">No vendors registered yet.</td></tr>'
        : vendors.map(v => `
            <tr>
              <td>${v.vendor_id}</td>
              <td>${v.name}</td>
              <td>${v.phone || "-"}</td>
              <td>${v.address || "-"}</td>
            </tr>`).join("");
    } catch (err) {
      console.error(err);
      tbody.innerHTML = '<tr><td colspan="4">Failed to load vendors. Please refresh.</td></tr>';
    }
  }

  document.getElementById("vendorForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const payload = {
      name:    document.getElementById("vendName").value.trim(),
      phone:   document.getElementById("vendPhone").value.trim(),
      address: document.getElementById("vendAddress").value.trim()
    };
    try {
      const res  = await fetch("/api/vendors", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok || !data.success) { showAlert(data.message || "Failed to add vendor.", "error"); return; }
      showAlert(data.message || "Vendor added successfully.", "success");
      document.getElementById("vendorForm").reset();
      loadVendors();
    } catch (err) {
      console.error(err);
      showAlert("Something went wrong. Please try again.", "error");
    }
  });

  loadVendors();
</script>
</body>
</html>
