<script src="/admin/assets/js/page-guard.js"></script>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700,800&display=swap" rel="stylesheet">
  <title>KURMA AJWA ENTERPRISE | Manage Orders</title>
  <link href="/admin/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/css/fontawesome.css">
  <style>
    :root { --bg:#FAF7F2; --sidebar:#2B2118; --sidebar-hover:#3B2E22; --accent:#A8333D; --accent-soft:#F3E3DD; --ink:#2B2118; --ink-soft:#8A7B6C; --line:#E8E1D8; --card:#FFFFFF; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Poppins',sans-serif; background:var(--bg); color:var(--ink); }
    .shell { display:flex; min-height:100vh; }
    .sidebar { width:260px; flex-shrink:0; background:var(--sidebar); color:#EDE6DC; display:flex; flex-direction:column; padding:28px 0; position:sticky; top:0; height:100vh; overflow-y:auto; }
    .sidebar-brand { padding:0 28px 28px; border-bottom:1px solid rgba(255,255,255,0.08); margin-bottom:20px; }
    .sidebar-brand .mark { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#C9A98A; margin:0 0 4px; }
    .sidebar-brand h2 { font-size:21px; font-weight:700; margin:0; line-height:1.25; }
    .sidebar-brand h2 em { font-style:normal; color:var(--accent); }
    .sidebar-nav { list-style:none; margin:0; padding:0; flex:1; }
    .sidebar-nav .nav-group-label { padding:16px 28px 6px; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:#8A7B6C; font-weight:600; }
    .sidebar-nav li a { display:flex; align-items:center; gap:12px; padding:13px 28px; color:#C9BFB2; text-decoration:none; font-size:14.5px; font-weight:500; border-left:3px solid transparent; transition:background .15s,color .15s; }
    .sidebar-nav li a i { width:18px; text-align:center; font-size:14px; }
    .sidebar-nav li a:hover { background:var(--sidebar-hover); color:#fff; }
    .sidebar-nav li a.active { background:var(--sidebar-hover); color:#fff; border-left-color:var(--accent); }
    .sidebar-footer { padding:0 28px; margin-top:12px; }
    .sidebar-footer a { display:flex; align-items:center; gap:10px; color:#C9BFB2; text-decoration:none; font-size:14px; padding:10px 0; border-top:1px solid rgba(255,255,255,0.08); }
    .sidebar-footer a:hover { color:#fff; }
    .main { flex:1; padding:40px 48px 60px; max-width:1200px; }
    .page-head { margin-bottom:32px; display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
    .page-head .eyebrow { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 6px; }
    .page-head h1 { font-size:28px; font-weight:700; margin:0 0 6px; }
    .page-head p { margin:0; color:var(--ink-soft); font-size:14.5px; }
    .search-box { position:relative; min-width:260px; }
    .search-box input {
      width:100%; border:1px solid var(--line); border-radius:6px; padding:10px 14px 10px 36px;
      font-size:13.5px; font-family:'Poppins',sans-serif; color:var(--ink); background:#fff;
    }
    .search-box input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
    .search-box i { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:13px; }
    .panel { background:var(--card); border-radius:10px; padding:28px; box-shadow:0 1px 3px rgba(43,33,24,0.06); }
    .panel h3 { font-size:16px; font-weight:600; margin:0 0 20px; }
    .table-wrapper { overflow-x:auto; }
    table.order-table { width:100%; border-collapse:collapse; }
    table.order-table th, table.order-table td { padding:12px 14px; text-align:left; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
    table.order-table th { background:#FBF8F4; font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.5px; color:var(--ink-soft); }
    table.order-table tbody tr:hover { background:#FBF8F4; }
    .status-badge { display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; }
    .status-pending  { background:#FBF1DC; color:#91701C; }
    .status-assigned { background:#E8F5EA; color:#1C7A3D; }
    .product-tag { display:inline-block; background:var(--accent-soft); color:var(--accent); border-radius:4px; padding:2px 8px; font-size:12px; margin:2px 2px 2px 0; }
    .assign-select { min-width:160px; border:1px solid var(--line); border-radius:6px; padding:7px 10px; font-size:13px; font-family:'Poppins',sans-serif; color:var(--ink); background:#fff; }
    .assign-select:focus { outline:none; border-color:var(--accent); }
    .action-cell { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
    .save-btn { background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; padding:7px 14px; font-size:13px; font-weight:600; transition:background .15s; }
    .save-btn:hover { background:#8E2A33; }
    .delete-btn { background:none; border:1px solid var(--line); color:var(--accent); border-radius:6px; cursor:pointer; padding:7px 12px; font-size:13px; font-weight:600; transition:background .15s, border-color .15s; }
    .delete-btn:hover { background:var(--accent-soft); border-color:var(--accent); }
    .view-btn { background:none; border:1px solid var(--line); color:var(--ink); border-radius:6px; cursor:pointer; padding:7px 12px; font-size:13px; font-weight:600; transition:background .15s, border-color .15s; }
    .view-btn:hover { background:#FBF8F4; border-color:var(--ink-soft); }
    #pageAlert { display:none; margin-bottom:20px; padding:12px 16px; border-radius:6px; font-size:14px; }
    #pageAlert.success { background:#E8F5EA; color:#1C7A3D; border:1px solid #BFE6C8; }
    #pageAlert.error { background:#FBE9E7; color:#A8333D; border:1px solid #EFC2BD; }

    /* ── Order details modal ─────────────────────────────────── */
    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(43,33,24,0.55);
      align-items:center; justify-content:center; padding:20px; z-index:1000;
    }
    .modal-overlay.open { display:flex; }
    .modal-box {
      background:#fff; border-radius:10px; width:100%; max-width:640px; max-height:88vh;
      overflow-y:auto; box-shadow:0 12px 40px rgba(43,33,24,0.25);
    }
    .modal-head {
      display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
      padding:22px 26px; border-bottom:1px solid var(--line);
    }
    .modal-head h3 { margin:0 0 4px; font-size:18px; font-weight:700; }
    .modal-head .sub { margin:0; font-size:13px; color:var(--ink-soft); }
    .modal-close {
      background:none; border:none; font-size:20px; line-height:1; color:var(--ink-soft);
      cursor:pointer; padding:2px 4px;
    }
    .modal-close:hover { color:var(--ink); }
    .modal-body { padding:22px 26px; }
    .detail-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:14px 20px; margin-bottom:22px;
    }
    .detail-item .label { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin:0 0 3px; }
    .detail-item .value { font-size:14px; font-weight:600; margin:0; }
    .detail-item .value.mono { font-family:monospace; font-size:13px; }
    table.detail-table { width:100%; border-collapse:collapse; margin-bottom:6px; }
    table.detail-table th, table.detail-table td { padding:9px 8px; text-align:left; font-size:13px; border-bottom:1px solid var(--line); }
    table.detail-table th { font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); }
    table.detail-table td.num, table.detail-table th.num { text-align:right; }
    .detail-thumb { width:34px; height:34px; border-radius:6px; object-fit:cover; vertical-align:middle; margin-right:8px; background:var(--accent-soft); }
    .grand-total-row td { font-weight:700; border-bottom:none; padding-top:14px; }

    @media (max-width:860px) {
      .shell { flex-direction:column; }
      .sidebar { width:100%; height:auto; position:relative; flex-direction:row; align-items:center; padding:14px 20px; overflow-x:auto; }
      .sidebar-brand { display:none; }
      .sidebar-nav { display:flex; flex:none; }
      .sidebar-nav li a { padding:8px 16px; border-left:none; border-bottom:3px solid transparent; white-space:nowrap; }
      .sidebar-nav li a.active { border-left:none; border-bottom-color:var(--accent); }
      .sidebar-footer { display:none; }
      .main { padding:28px 20px 40px; }
      .page-head { flex-direction:column; align-items:flex-start; }
      .detail-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <p class="mark">Admin Panel</p>
      <h2>KURMA <em>AJWA</em></h2>
    </div>
      <ul class="sidebar-nav" id="sidebarNav"></ul>
    <div class="sidebar-footer">
      <a href="#" onclick="logout()"><i class="fa fa-sign-out"></i> Logout</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <div>
        <p class="eyebrow">Operations</p>
        <h1>Manage Orders</h1>
        <p>View customer orders, assigned products, and assign workers.</p>
      </div>
      <div class="search-box">
        <i class="fa fa-search"></i>
        <input type="text" id="orderSearchInput" placeholder="Search by order ID, customer, product, status...">
      </div>
    </div>

    <div id="pageAlert"></div>

    <div class="panel">
      <h3>All Orders</h3>
      <div class="table-wrapper">
        <table class="order-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date</th>
              <th>Customer</th>
              <th>Products Ordered</th>
              <th>Status</th>
              <th>Assign Worker</th>
            </tr>
          </thead>
          <tbody id="orderTableBody">
            <tr><td colspan="6">Loading orders...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Order details modal -->
<div class="modal-overlay" id="orderDetailsOverlay" onclick="if(event.target===this) closeOrderDetails()">
  <div class="modal-box">
    <div class="modal-head">
      <div>
        <h3 id="odTitle">Order</h3>
        <p class="sub" id="odSub"></p>
      </div>
      <button class="modal-close" onclick="closeOrderDetails()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="odBody">
      <!-- filled by JS -->
    </div>
  </div>
</div>

<script src="/admin/vendor/jquery/jquery.min.js"></script>
<script src="/admin/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
  function logout() { localStorage.removeItem("role"); window.location.href = "/"; }

  let workersCache = [];
  let ordersCache  = [];

  function showAlert(msg, type) {
    const box = document.getElementById("pageAlert");
    box.textContent = msg; box.className = type; box.style.display = "block";
    setTimeout(() => { box.style.display = "none"; }, 4000);
  }

  function formatDate(d) {
    if (!d) return "-";
    const dt = new Date(d);
    return isNaN(dt) ? d : dt.toLocaleDateString("en-MY", { day:"2-digit", month:"short", year:"numeric" });
  }

  function formatMoney(n) {
    const num = Number(n) || 0;
    return "RM " + num.toFixed(2);
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  function buildWorkerOptions(selectedId) {
    let html = '<option value="">-- Unassigned --</option>';
    workersCache.forEach(w => {
      const sel = String(w.worker_id) === String(selectedId) ? "selected" : "";
      html += `<option value="${w.worker_id}" ${sel}>${w.name}</option>`;
    });
    return html;
  }

  // Renders a given list of orders into the table. Kept separate from
  // loadOrders so the search box can re-render a filtered subset of
  // ordersCache without refetching.
  function renderOrders(list) {
    const tbody = document.getElementById("orderTableBody");
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6">${ordersCache.length === 0 ? "No orders found." : "No orders match your search."}</td></tr>`;
      return;
    }

    tbody.innerHTML = list.map(o => {
      const isAssigned = o.worker_id !== null && o.worker_id !== undefined;
      const statusClass = isAssigned ? "status-assigned" : "status-pending";
      const statusText  = isAssigned ? "Assigned" : "Pending";
      const productTags = o.products && o.products.length > 0
        ? o.products.map(p => `<span class="product-tag">${escapeHtml(p.product_name)} x${p.qty}</span>`).join("")
        : '<span style="color:var(--ink-soft);font-size:13px;">-</span>';

      return `
        <tr>
          <td>#${o.order_id}</td>
          <td>${formatDate(o.order_date)}</td>
          <td>${escapeHtml(o.customer_name || "Customer #" + o.customer_id)}</td>
          <td>${productTags}</td>
          <td><span class="status-badge ${statusClass}">${statusText}</span></td>
          <td>
            <div class="action-cell">
              <select class="assign-select" id="select-${o.order_id}">${buildWorkerOptions(o.worker_id)}</select>
              <button class="save-btn" onclick="assignWorker(${o.order_id})">Save</button>
              <button class="view-btn" onclick="viewOrderDetails(${o.order_id})">Details</button>
              <button class="delete-btn" onclick="deleteOrder(${o.order_id})">Delete</button>
            </div>
          </td>
        </tr>`;
    }).join("");
  }

  // Matches on order ID, customer name, status (pending/assigned), or
  // any product name within the order.
  function filterOrders(term) {
    return ordersCache.filter(o => {
      const idMatch       = String(o.order_id).includes(term);
      const customerMatch = (o.customer_name || "").toLowerCase().includes(term);
      const dateMatch     = formatDate(o.order_date).toLowerCase().includes(term);
      const isAssigned    = o.worker_id !== null && o.worker_id !== undefined;
      const statusMatch   = (isAssigned ? "assigned" : "pending").includes(term);
      const prodMatch     = (o.products || []).some(p => (p.product_name || "").toLowerCase().includes(term));
      return idMatch || customerMatch || dateMatch || statusMatch || prodMatch;
    });
  }

  document.getElementById("orderSearchInput").addEventListener("input", function () {
    const term = this.value.trim().toLowerCase();
    renderOrders(term ? filterOrders(term) : ordersCache);
  });

  async function loadOrders() {
    const tbody = document.getElementById("orderTableBody");
    try {
      // Load workers for dropdown
      const wRes  = await fetch("/api/orders/workers");
      const wData = await wRes.json();
      if (wRes.ok && wData.success) workersCache = wData.workers || [];

      const res  = await fetch("/api/orders");
      const data = await res.json();
      if (!res.ok || !data.success) throw new Error(data.message);

      ordersCache = data.orders || [];

      // Re-apply whatever's currently in the search box (e.g. after
      // assigning a worker refreshes the list) instead of always
      // showing everything.
      const term = document.getElementById("orderSearchInput").value.trim().toLowerCase();
      renderOrders(term ? filterOrders(term) : ordersCache);

      // If the details modal is open for an order, refresh it too (e.g.
      // after a re-assign) instead of leaving stale data on screen.
      if (currentDetailsOrderId !== null) {
        const stillThere = ordersCache.find(o => o.order_id === currentDetailsOrderId);
        if (stillThere) renderOrderDetailsModal(stillThere);
        else closeOrderDetails();
      }

    } catch (err) {
      console.error(err);
      tbody.innerHTML = '<tr><td colspan="6">Failed to load orders. Please refresh.</td></tr>';
    }
  }

  async function assignWorker(orderId) {
    const workerId = document.getElementById(`select-${orderId}`).value || null;
    try {
      const res  = await fetch(`/api/orders/${orderId}/assign`, {
        method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ worker_id: workerId })
      });
      const data = await res.json();
      if (!res.ok || !data.success) { showAlert(data.message || "Failed to assign worker.", "error"); return; }
      showAlert(data.message || `Order #${orderId} updated.`, "success");
      loadOrders();
    } catch (err) {
      console.error(err);
      showAlert("Something went wrong.", "error");
    }
  }

  // Confirms before deleting since this is irreversible — use for
  // duplicate orders, test orders, or anything placed by mistake.
  async function deleteOrder(orderId) {
    if (!confirm(`Delete order #${orderId}? This will remove the order and its line items permanently.`)) return;
    try {
      const res  = await fetch(`/api/orders/${orderId}`, { method: "DELETE" });
      const data = await res.json();
      if (!res.ok || !data.success) { showAlert(data.message || "Failed to delete order.", "error"); return; }
      showAlert(data.message || `Order #${orderId} deleted.`, "success");
      if (currentDetailsOrderId === orderId) closeOrderDetails();
      loadOrders();
    } catch (err) {
      console.error(err);
      showAlert("Something went wrong.", "error");
    }
  }

  // ── Order details modal ──────────────────────────────────────
  let currentDetailsOrderId = null;

  function viewOrderDetails(orderId) {
    const order = ordersCache.find(o => o.order_id === orderId);
    if (!order) { showAlert("Could not find that order.", "error"); return; }
    currentDetailsOrderId = orderId;
    renderOrderDetailsModal(order);
    document.getElementById("orderDetailsOverlay").classList.add("open");
  }

  function closeOrderDetails() {
    currentDetailsOrderId = null;
    document.getElementById("orderDetailsOverlay").classList.remove("open");
  }

  function renderOrderDetailsModal(order) {
    const isAssigned  = order.worker_id !== null && order.worker_id !== undefined;
    const statusClass = isAssigned ? "status-assigned" : "status-pending";

    document.getElementById("odTitle").textContent = `Order #${order.order_id}`;
    document.getElementById("odSub").textContent = `Placed ${formatDate(order.order_date)}`;

    const products = order.products || [];
    const rows = products.length
      ? products.map(p => `
          <tr>
            <td>
              ${p.image_url ? `<img class="detail-thumb" src="${p.image_url}" alt="">` : ""}
              ${escapeHtml(p.product_name || "Product #" + p.product_id)}
            </td>
            <td class="num">${p.qty}</td>
            <td class="num">${formatMoney(p.price)}</td>
            <td class="num">${formatMoney(p.line_total)}</td>
          </tr>`).join("")
      : `<tr><td colspan="4" style="color:var(--ink-soft);">No products on this order.</td></tr>`;

    document.getElementById("odBody").innerHTML = `
      <div class="detail-grid">
        <div class="detail-item">
          <p class="label">Customer</p>
          <p class="value">${escapeHtml(order.customer_name || "Customer #" + order.customer_id)}</p>
        </div>
        <div class="detail-item">
          <p class="label">Status</p>
          <p class="value"><span class="status-badge ${statusClass}">${order.status || (isAssigned ? "Assigned" : "Pending")}</span></p>
        </div>
        <div class="detail-item">
          <p class="label">Assigned Worker</p>
          <p class="value">${order.worker_name ? escapeHtml(order.worker_name) : "Unassigned"}</p>
        </div>
        <div class="detail-item">
          <p class="label">Tracking No.</p>
          <p class="value mono">${order.tracking_no ? escapeHtml(order.tracking_no) : "Not shipped yet"}</p>
        </div>
      </div>

      <table class="detail-table">
        <thead>
          <tr>
            <th>Product</th>
            <th class="num">Qty</th>
            <th class="num">Price</th>
            <th class="num">Line Total</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
          <tr class="grand-total-row">
            <td colspan="3">Order Total</td>
            <td class="num">${formatMoney(order.total)}</td>
          </tr>
        </tbody>
      </table>
    `;
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && currentDetailsOrderId !== null) closeOrderDetails();
  });

  loadOrders();
</script>
</body>
</html>
