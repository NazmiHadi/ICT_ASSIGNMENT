  <body>

    <div class="shell">

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <p class="mark">Admin Panel</p>
          <h2>KURMA <em>AJWA</em></h2>
        </div>

        <ul class="sidebar-nav">
          <li><a href="dashboard"><i class="fa fa-th-large"></i> Dashboard</a></li>
          <li><a href="workers"><i class="fa fa-users"></i> Manage Workers</a></li>
          <li><a href="orders" class="active"><i class="fa fa-list-alt"></i> Manage Orders</a></li>
        </ul>

        <div class="sidebar-footer">
          <a href="#" onclick="logout()"><i class="fa fa-sign-out"></i> Logout</a>
        </div>
      </aside>

      <!-- Main content -->
      <main class="main">

        <div class="page-head">
          <p class="eyebrow">Operations</p>
          <h1>Manage Orders</h1>
          <p>Assign a worker to each order and track who's handling what.</p>
        </div>

        <div id="pageAlert"></div>

        <div class="panel">
          <h3>All Orders</h3>
          <div class="table-wrapper">
            <table class="order-table">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Order Date</th>
                  <th>Customer</th>
                  <th>Status</th>
                  <th>Assign Worker</th>
                </tr>
              </thead>
              <tbody id="orderTableBody">
                <tr><td colspan="5">Loading orders...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>

    </div>

    <!-- Bootstrap core JavaScript -->
    <script src="/admin/vendor/jquery/jquery.min.js"></script>
    <script src="/admin/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
      function logout() {
        localStorage.removeItem("role");
        window.location.href = "../login.html";
      }

      const ORDERS_API = "/api/orders";
      let workersCache = [];

      function showAlert(message, type) {
        const alertBox = document.getElementById("pageAlert");
        alertBox.textContent = message;
        alertBox.className = type;
        alertBox.style.display = "block";
        setTimeout(() => { alertBox.style.display = "none"; }, 4000);
      }

      function formatDate(dateStr) {
        if (!dateStr) return "-";
        const d = new Date(dateStr);
        if (isNaN(d)) return dateStr;
        return d.toLocaleDateString("en-MY", { day: "2-digit", month: "short", year: "numeric" });
      }

      function buildWorkerOptions(selectedWorkerId) {
        let options = '<option value="">-- Unassigned --</option>';
        workersCache.forEach(w => {
          const selected = String(w.worker_id) === String(selectedWorkerId) ? "selected" : "";
          options += `<option value="${w.worker_id}" ${selected}>${w.name}</option>`;
        });
        return options;
      }

      async function loadWorkersCache() {
        const res = await fetch(`${ORDERS_API}/workers`);
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message || "Failed to load workers list");
        workersCache = data.workers || [];
      }

      async function loadOrders() {
        const tableBody = document.getElementById("orderTableBody");
        try {
          await loadWorkersCache();

          const res = await fetch(ORDERS_API);
          const data = await res.json();
          if (!res.ok || !data.success) throw new Error(data.message || "Request failed");

          const orders = data.orders || [];

          if (orders.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5">No orders found.</td></tr>';
            return;
          }

          tableBody.innerHTML = orders.map(o => {
            const isAssigned = o.worker_id !== null && o.worker_id !== undefined;
            const statusClass = isAssigned ? "status-assigned" : "status-pending";
            const statusText = isAssigned ? "Assigned" : "Pending";

            return `
              <tr data-order-id="${o.order_id}">
                <td>${o.order_id}</td>
                <td>${formatDate(o.order_date)}</td>
                <td>${o.customer_name || "Customer #" + o.customer_id}</td>
                <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                <td>
                  <select class="assign-select" id="select-${o.order_id}">
                    ${buildWorkerOptions(o.worker_id)}
                  </select>
                  <button class="save-btn" onclick="assignWorker(${o.order_id})">Save</button>
                </td>
              </tr>
            `;
          }).join("");

        } catch (err) {
          console.error(err);
          tableBody.innerHTML = '<tr><td colspan="5">Failed to load orders. Please refresh.</td></tr>';
        }
      }

      async function assignWorker(orderId) {
        const select = document.getElementById(`select-${orderId}`);
        const workerId = select.value || null;

        try {
          const res = await fetch(`${ORDERS_API}/${orderId}/assign`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ worker_id: workerId }),
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            showAlert(data.message || "Failed to assign worker.", "error");
            return;
          }

          showAlert(data.message || `Order #${orderId} updated successfully.`, "success");
          loadOrders();

        } catch (err) {
          console.error(err);
          showAlert("Something went wrong. Please try again.", "error");
        }
      }

      loadOrders();
    </script>

  </body>
