<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Kurma Ajwa Enterprise</title>
    <meta name="description" content="Customer and Admin Login">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Grain texture overlay -->
    <div class="grain"></div>

    <div class="login-container">
        <div class="login-card">

            <div class="login-header">
                <h2>KURMA <em style="font-style:italic; color:#a0522d;">AJWA</em></h2>
                <p>Sign in to your account</p>
            </div>

            <form class="login-form" id="loginForm" novalidate>

                <!-- Username -->
                <div class="form-group">
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            autocomplete="username">
                        <label for="username">Username</label>
                    </div>
                    <span class="error-message"></span>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <div class="input-wrapper password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="current-password">
                        <label for="password">Password</label>
                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Toggle password visibility">
                            <span class="eye-icon"></span>
                        </button>
                    </div>
                    <span class="error-message"></span>
                </div>

                <!-- Remember Me -->
                <div class="form-options">
                    <label class="remember-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkbox-label">
                            <span class="checkmark"></span>
                            Remember me
                        </span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader"></span>
                </button>

            </form>

            <!-- Register Link -->
            <div class="signup-link">
                <p>Don't have an account? <a href="/register">Create one</a></p>
            </div>

            <!-- Success Message -->
            <div class="success-message" id="successMessage" style="display:none;">
                <div class="success-icon">✓</div>
                <h3>Login Successful!</h3>
                <p>Redirecting to your dashboard...</p>
            </div>

        </div>
    </div>

    <!-- Password Show/Hide -->
    <script>
        const passwordToggle = document.getElementById("passwordToggle");
        const passwordInput  = document.getElementById("password");
        const eyeIcon        = passwordToggle.querySelector(".eye-icon");

        passwordToggle.addEventListener("click", function () {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.classList.add("show-password");
            } else {
                passwordInput.type = "password";
                eyeIcon.classList.remove("show-password");
            }
        });
    </script>

    <!-- auth.js handles the login form submission (see assets/js/auth.js) -->
    <script src="/assets/js/auth.js"></script>

</body>
</html>
