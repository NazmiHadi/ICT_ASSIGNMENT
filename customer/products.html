<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Kurma Ajwa Products</title>

  <!-- Bootstrap CSS -->
  <link href="/customer/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS files -->
  <link rel="stylesheet" href="/customer/assets/css/fontawesome.css">
  <link rel="stylesheet" href="/customer/assets/css/templatemo-sixteen.css">
  <link rel="stylesheet" href="/customer/assets/css/owl.css">

  <style>
    /* ── Add to cart button (matches product_details.html) ───────────── */
    .add-to-cart-btn {
      background: linear-gradient(135deg, #6b3a1f 0%, #a0522d 60%, #c8844a 100%);
      border: none;
      border-radius: 4px;
      color: #fdf6ed;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 13px 36px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 3px 12px rgba(107,58,31,0.3);
    }

    .add-to-cart-btn:hover {
      background: linear-gradient(135deg, #3b1f0a 0%, #6b3a1f 60%, #a0522d 100%);
      box-shadow: 0 5px 18px rgba(59,31,10,0.35);
      transform: translateY(-1px);
    }

    .add-to-cart-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
  </style>
</head>

<body>

  <!-- Preloader spinner shown while the page is loading -->
  <div id="preloader">
    <div class="jumper"><div></div><div></div><div></div></div>
  </div>

  <!-- Navigation bar -->
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/customer/home" style="display: flex; align-items: center; gap: 15px;">
          <img src="/customer/assets/images/logo_kurma_ajwa.png" alt="Kurma Ajwa Logo" style="height: 45px; width: auto; object-fit: contain;">
          <h2>KURMA <em>AJWA</em></h2>
          </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ml-auto">
          <li class="nav-item"><a class="nav-link" href="/customer/home">Home</a></li>
          <li class="nav-item active"><a class="nav-link" href="/customer/products">Our Products</a></li>
          <li class="nav-item"><a class="nav-link" href="/customer/about">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="/customer/contact">Contact Us</a></li>

          <li class="nav-item">
            <a class="nav-link" href="/customer/cart" style="position: relative;">
              <i class="fa fa-shopping-cart"></i> Cart
              <span id="cartBadge"
                    style="display:none; position:absolute; top:-5px; right:-10px;
                          background:#e74c3c; color:#fff; border-radius:50%;
                          padding:2px 6px; font-size:11px;">0</span>
            </a>
          </li>
          <li>
            <a class="nav-link" href="/customer/profile">My Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" onclick="logout()">Logout</a>
          </li>
        </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Page banner / hero section -->
  <div class="page-heading products-heading header-text">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="text-content">
            <h4>Browse</h4>
            <h2>Our Products</h2>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Products section -->
  <div class="products">
    <div class="container">
      <div class="row">

        <!-- Filter buttons – uses the Isotope JS library to sort/filter cards -->
        <div class="col-md-12">
          <div class="filters">
            <ul>
              <li class="active" data-filter="*">All Products</li>
              <li data-filter=".des">Featured</li>
              <li data-filter=".dev">Flash Deals</li>
              <li data-filter=".gra">Last Minute</li>
            </ul>
          </div>
        </div>

        <!-- Product cards container -->
        <div class="col-md-12">
          <div class="filters-content">
            <div class="row grid" id="productGrid">

              <!-- Loading placeholder shown while the API call is in progress -->
              <div class="col-12 text-center py-4" id="loadingMsg">
                <p>Loading products...</p>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>


  <!-- JavaScript libraries (must be in this order) -->
  <script src="/customer/vendor/jquery/jquery.min.js"></script>
  <script src="/customer/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/customer/assets/js/custom.js"></script>
  <script src="/customer/assets/js/owl.js"></script>
  <script src="/customer/assets/js/slick.js"></script>
  <script src="/customer/assets/js/isotope.js"></script>
  <script src="/customer/assets/js/accordions.js"></script>
  <script src="/customer/assets/js/cart.js"></script>
  <script src="/customer/assets/js/purchase.js"></script>


  <!-- ── Product loading + logout script ─────────────────────────────── -->
  <script>

    function logout() {
      localStorage.removeItem("role");
      localStorage.removeItem("customer");
      window.location.href = "/";
    }


    // ── loadProducts(): fetch products from server and render them ───────
    async function loadProducts() {

      try {
        const response = await fetch("/api/products");
        const data = await response.json();

        if (!data.success || !data.products.length) {
          document.getElementById("loadingMsg").textContent = "No products found.";
          return;
        }

        const grid = document.getElementById("productGrid");
        grid.innerHTML = "";

        const filterClasses = ["all des", "all dev", "all gra"];

        data.products.forEach((product, index) => {
          const filterClass = filterClasses[index % filterClasses.length];
          const stars = '<li><i class="fa fa-star"></i></li>'.repeat(5);

          // Image comes from the API's image_url (the real uploaded file
          // under /uploads/products/...), with a placeholder fallback for
          // products that don't have a picture yet. Previously this built
          // a guessed path under /customer/assets/images/ from product.image,
          // which broke unless someone manually dropped a matching file there.
          const imgSrc = product.image_url || "/customer/assets/images/product-placeholder.png";

          const cardHTML = `
            <div class="col-lg-4 col-md-4 ${filterClass}">
              <div class="product-item">
                <a href="/customer/product_details?product_id=${product.product_id}">
                  <img src="${imgSrc}" alt="${product.name}">
                </a>
                <div class="down-content">
                  <a href="/customer/product_details?product_id=${product.product_id}"><h4>${product.name}</h4></a>
                  <h6>$${(product.price ?? 0).toFixed(2)}</h6>
                  <p>${product.description}</p>
                  <ul class="stars">${stars}</ul>
                  <span>Stock: ${product.stock} units</span>
                  <button class="btn btn-primary add-to-cart-btn" data-id="${product.product_id}">
                    Add to Cart
                  </button>
                </div>
              </div>
            </div>
          `;

          grid.insertAdjacentHTML("beforeend", cardHTML);

          const newCard = grid.lastElementChild.querySelector(".add-to-cart-btn");

          if ((product.stock ?? 0) <= 0) {
            newCard.disabled = true;
            newCard.textContent = "Out of Stock";
          }

          newCard.addEventListener("click", () => {
            try {
              addToCart(product, 1);
              alert(`${product.name} added to cart.`);
            } catch (err) {
              alert(err.message);
            }
          });
        });

        // Re-initialise Isotope after adding dynamic content.
        setTimeout(() => {
          const $grid = $(".grid");
          if ($grid.length && typeof $.fn.isotope !== "undefined") {
            $grid.isotope({ itemSelector: "[class*='col-']", layoutMode: "fitRows" });
          }
        }, 200);

      } catch (err) {
        document.getElementById("loadingMsg").textContent =
          "Failed to load products. Is the server running?";
        console.error("Products fetch error:", err);
      }
    }


    // ── Run on page load ─────────────────────────────────────────────────
    document.addEventListener("DOMContentLoaded", loadProducts);

  </script>

</body>
</html>
