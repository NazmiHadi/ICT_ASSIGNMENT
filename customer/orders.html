<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>My Orders - Kurma Ajwa</title>

  <link href="/customer/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/customer/assets/css/fontawesome.css">
  <link rel="stylesheet" href="/customer/assets/css/templatemo-sixteen.css">
  <link rel="stylesheet" href="/customer/assets/css/owl.css">

  <style>
    .order-card {
      border: 1px solid #eee;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .order-id {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .order-date {
      color: #888;
      font-size: 0.85rem;
    }


    .order-item-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid #f5f5f5;
    }

    .order-item-row:last-child {
      border-bottom: none;
    }

    .order-item-img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .order-item-info {
      flex: 1;
    }

    .order-item-name {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .order-item-meta {
      font-size: 0.82rem;
      color: #888;
    }

    .order-item-line-total {
      font-weight: 700;
      white-space: nowrap;
    }

    .order-card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .state-message {
      text-align: center;
      padding: 80px 20px;
      color: #888;
      font-size: 1rem;
    }

    .state-message.error {
      color: #c0392b;
    }
  </style>
</head>

<body>

  <div id="preloader">
    <div class="jumper"><div></div><div></div><div></div></div>
  </div>

  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/customer/home" style="display: flex; align-items: center; gap: 15px;">
          <img src="/customer/assets/images/logo_kurma_ajwa.png" alt="Kurma Ajwa Logo" style="height: 45px; width: auto; object-fit: contain;">
          <h2>KURMA <em>AJWA</em></h2>
          </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="/customer/home">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/customer/products">Our Products</a></li>
            <li class="nav-item"><a class="nav-link" href="/customer/about">About Us</a></li>
            <li class="nav-item"><a class="nav-link" href="/customer/contact">Contact Us</a></li>
            <li class="nav-item active"><a class="nav-link" href="/customer/orders">My Orders</a></li>
            <li class="nav-item">
              <a class="nav-link" href="/customer/cart" style="position: relative;">
                <i class="fa fa-shopping-cart"></i> Cart
                <span id="cartBadge"
                      style="display:none; position:absolute; top:-5px; right:-10px;
                            background:#e74c3c; color:#fff; border-radius:50%;
                            padding:2px 6px; font-size:11px;">0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#" onclick="logout()">Logout</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <div class="page-heading products-heading header-text">
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <div class="text-content">
            <h4>Review</h4>
            <h2>Your Orders</h2>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="products">
    <div class="container">

      <div id="stateMessage" class="state-message">
        <p>Loading your orders...</p>
      </div>

      <div id="ordersContainer" style="display:none;"></div>

    </div>
  </div>

  <!-- Order card template -->
  <template id="orderTemplate">
    <div class="order-card">
      <div class="order-card-header">
        <div>
          <span class="order-id"></span>
          <div class="order-date"></div>
        </div>
      </div>
      <div class="order-items"></div>
      <div class="order-card-footer">
        <span>Total:&nbsp;</span>
        <span class="order-total"></span>
      </div>
    </div>
  </template>

  <!-- Order item row template -->
  <template id="orderItemTemplate">
    <div class="order-item-row">
      <img class="order-item-img" src="" alt="">
      <div class="order-item-info">
        <p class="order-item-name"></p>
        <span class="order-item-meta"></span>
      </div>
      <strong class="order-item-line-total"></strong>
    </div>
  </template>

  <script src="/customer/vendor/jquery/jquery.min.js"></script>
  <script src="/customer/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/customer/assets/js/custom.js"></script>
  <script src="/customer/assets/js/cart.js"></script>
  <script src="/customer/assets/js/order.js"></script>

  <script>
    function logout() {
      localStorage.removeItem("role");
      localStorage.removeItem("customer");
      window.location.href = "/";
    }
  </script>

</body>
</html>
